spring.datasource.url=jdbc:h2:mem:stackfolio_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.ssl.enabled=false
spring.data.redis.repositories.enabled=false

springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

stackfolio.jwt.private-key=
stackfolio.jwt.public-key=
stackfolio.jwt.generate-dev-keys=true
stackfolio.jwt.access-token-ttl-seconds=3600
stackfolio.cors.allowed-origins=http://localhost:3000
stackfolio.email.resend.api-key=
stackfolio.email.from=
management.health.redis.enabled=false

spring.ai.openai.api-key=test-key
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.model=qwen/qwen3.8-27b
spring.ai.openai.chat.temperature=0.2
