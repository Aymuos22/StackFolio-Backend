spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/stackfolio}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}

spring.jpa.show-sql=true

springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

stackfolio.jwt.generate-dev-keys=true
stackfolio.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

spring.data.redis.host=${UPSTASH_REDIS_HOST:localhost}
spring.data.redis.port=${UPSTASH_REDIS_PORT:6379}
spring.data.redis.password=${UPSTASH_REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${UPSTASH_REDIS_SSL:false}
spring.data.redis.repositories.enabled=false
