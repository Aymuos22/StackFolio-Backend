spring.application.name=StackFolio
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.data.redis.host=${UPSTASH_REDIS_HOST}
spring.data.redis.port=${UPSTASH_REDIS_PORT:6379}
spring.data.redis.username=${UPSTASH_REDIS_USERNAME:default}
spring.data.redis.password=${UPSTASH_REDIS_PASSWORD}
spring.data.redis.ssl.enabled=${UPSTASH_REDIS_SSL:true}
spring.data.redis.repositories.enabled=false

springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}

stackfolio.jwt.private-key=${JWT_PRIVATE_KEY:}
stackfolio.jwt.public-key=${JWT_PUBLIC_KEY:}
stackfolio.jwt.access-token-ttl-seconds=${JWT_ACCESS_TOKEN_TTL_SECONDS:3600}
stackfolio.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
stackfolio.rate-limit.auth.max-requests=${AUTH_RATE_LIMIT_MAX_REQUESTS:20}
stackfolio.rate-limit.auth.window-seconds=${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
stackfolio.password-reset.otp-ttl-seconds=${PASSWORD_RESET_OTP_TTL_SECONDS:300}
stackfolio.password-reset.cooldown-seconds=${PASSWORD_RESET_COOLDOWN_SECONDS:60}
stackfolio.password-reset.max-attempts=${PASSWORD_RESET_MAX_ATTEMPTS:5}
stackfolio.email.resend.api-key=${RESEND_API_KEY:}
stackfolio.email.from=${RESEND_FROM_EMAIL:}

stackfolio.r2.account-id=${R2_ACCOUNT_ID:}
stackfolio.r2.access-key-id=${R2_ACCESS_KEY_ID:}
stackfolio.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
stackfolio.r2.bucket=${R2_BUCKET:}
stackfolio.r2.public-base-url=${R2_PUBLIC_BASE_URL:}
stackfolio.r2.max-file-size-bytes=${R2_MAX_FILE_SIZE_BYTES:5242880}

spring.servlet.multipart.max-file-size=${R2_MAX_FILE_SIZE_BYTES:5242880}
spring.servlet.multipart.max-request-size=${R2_MAX_FILE_SIZE_BYTES:5242880}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
